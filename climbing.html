<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Leo núi cùng thiết bị nhập – xuất</title>
<style>
:root{--bg:#ffe9c7;--card:#fffdf8;--tx:#2a2140;--mu:#6b5f85;--bd:#2a2140;--in:#16a765;--out:#ff7a2f;--both:#8b5cf6;--s1:#5cc8ff;--s2:#d9f3ff;--m1:#9fb4d6;--m2:#6f86b3;--m3:#4f6797;--snow:#fff;--gr:#58c26b;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1a1530;--card:#262042;--tx:#f4efff;--mu:#b8aedb;--bd:#0b0818;--s1:#1b2a66;--s2:#5a4a9c;--m1:#5d6a9c;--m2:#43508a;--m3:#2f3a6e;--snow:#e6ecff;--gr:#2f8f4e;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#1a1530;--card:#262042;--tx:#f4efff;--mu:#b8aedb;--bd:#0b0818;--s1:#1b2a66;--s2:#5a4a9c;--m1:#5d6a9c;--m2:#43508a;--m3:#2f3a6e;--snow:#e6ecff;--gr:#2f8f4e;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font-family:"Baloo 2","Comic Sans MS","Trebuchet MS",system-ui,sans-serif;min-height:100vh;overflow-x:hidden}
.wrap{max-width:1100px;margin:0 auto;padding:8px 12px;display:flex;flex-direction:column;height:max(560px,calc(100vh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}
@supports(height:100dvh){.wrap{height:max(560px,calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px)))}}
.main{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:14px;align-items:stretch;grid-template-rows:minmax(0,1fr);flex:1 1 0;min-height:0;margin-bottom:8px}
.main .scene{height:100%}
.main .card{margin-top:0;height:100%;min-height:0;overflow:hidden;display:flex;flex-direction:column;justify-content:center}
@media(max-width:820px){.main{grid-template-columns:1fr;grid-template-rows:none;gap:0;margin-bottom:0}.main .scene{height:340px}.main .card{margin-top:14px;height:auto;overflow:visible}}
h1{font-size:1.9rem;margin:0;text-align:center;letter-spacing:.5px}
h1 span{display:inline-block;animation:bob 2s ease-in-out infinite}
.sub{text-align:center;color:var(--mu);margin:0 0 6px;font-size:1.1rem}
.hud{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between;align-items:center;margin-bottom:8px}
.pill{background:var(--card);border:3px solid var(--bd);border-radius:99px;padding:1px 12px;font-weight:800;font-size:1.1rem;box-shadow:0 3px 0 var(--bd)}
.meter{flex:1;min-width:120px;height:20px;border:3px solid var(--bd);border-radius:99px;background:var(--card);overflow:hidden;box-shadow:0 3px 0 var(--bd)}
.meter i{display:block;height:100%;width:0;background:linear-gradient(90deg,#ffd23f,#ff7a2f);transition:width .7s}
.snd{cursor:pointer;font:inherit}
.scene{position:relative;height:400px;border-radius:22px;overflow:hidden;border:4px solid var(--bd);box-shadow:0 6px 0 var(--bd);background:linear-gradient(var(--s1),var(--s2))}
.scene.shake{animation:shake .5s}
.scene svg{position:absolute;inset:0;width:100%;height:100%}
.cloud{position:absolute;font-size:44px;opacity:.9;animation:drift linear infinite}
.sun{position:absolute;right:12px;top:8px;font-size:46px;animation:spin 20s linear infinite}
.sp{position:absolute;line-height:1;transform:translate(-50%,-100%);transition:left .8s cubic-bezier(.3,1.4,.5,1),top .8s cubic-bezier(.3,1.4,.5,1),transform .5s,opacity .5s;z-index:3}
.ledge{position:absolute;width:76px;height:12px;border-radius:8px;background:#b8793f;border-bottom:4px solid #7a4a22;transform:translate(-50%,0);z-index:1}
.tree{position:absolute;font-size:30px;bottom:-2px;z-index:2}
#climber{font-size:44px}
#climber.up{animation:hop .8s}
#boulder{font-size:50px;animation:bob 1.5s ease-in-out infinite}
#boulder.gone{transform:translate(-50%,-100%) scale(.1) rotate(300deg);opacity:0}
#flag{font-size:42px;animation:wave 1s ease-in-out infinite alternate}
.pt{position:absolute;z-index:5;font-size:22px;pointer-events:none;animation:burst .9s ease-out forwards}
.cf{position:fixed;top:-30px;z-index:50;font-size:24px;pointer-events:none;animation:fall 3s linear forwards}
.combo{position:absolute;left:10px;top:10px;z-index:6;background:#ff7a2f;color:#fff;font-weight:900;border:3px solid var(--bd);border-radius:14px;padding:2px 12px;font-size:1.3rem;display:none;animation:pop .4s}
.card{background:var(--card);border:4px solid var(--bd);border-radius:22px;padding:10px 14px;margin-top:14px;text-align:center;box-shadow:0 6px 0 var(--bd)}
.hint{color:var(--mu);font-weight:700;margin-bottom:2px;font-size:1.2rem}
.dev{font-size:76px;line-height:1.1;animation:pop .5s,bob 2.2s .5s ease-in-out infinite}
.devname{font-size:1.9rem;font-weight:900;margin:0 0 8px}
.btns{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.card.done .btns,.card.done .grid{display:none}
button.a{font:inherit;cursor:pointer;color:#fff;font-weight:900;font-size:1.25rem;border:3px solid var(--bd);border-radius:16px;padding:8px 4px;box-shadow:0 5px 0 var(--bd);transition:transform .1s,box-shadow .1s;text-shadow:0 2px 0 rgba(0,0,0,.25)}
button.a:active:not(:disabled){transform:translateY(4px);box-shadow:0 1px 0 var(--bd)}
button.a small{display:block;font-weight:700;font-size:.92rem;opacity:.95}
button.a b{display:block;font-size:1.7rem}
button:disabled{opacity:.5;cursor:default}
.b-in{background:var(--in)}.b-out{background:var(--out)}.b-both{background:var(--both)}
.fb{margin-top:8px;padding:8px 12px;font-size:1.1rem;border-radius:14px;text-align:left;border:3px solid var(--bd);display:none;animation:pop .3s}
.fb.ok{display:block;background:#c9f7d9;color:#0d3b22}
.fb.no{display:block;background:#ffd6d6;color:#4a1010}
.next{display:none;width:100%;margin-top:8px;background:#2f7bff}
.guide{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-top:10px;font-size:1.05rem;color:var(--mu)}
.guide div{background:var(--card);border:3px solid var(--bd);border-radius:14px;padding:6px 10px}
.guide b{display:block;font-size:1.2rem}
.end .dev{font-size:90px}
.scene.s2{background:linear-gradient(#ff8a5c,#ffe3a6)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:6px 0 8px;flex:1 1 0;min-height:0;grid-template-rows:repeat(2,minmax(0,1fr))}
.opt{font:inherit;cursor:pointer;background:var(--card);color:var(--tx);border:3px solid var(--bd);border-radius:14px;padding:6px 6px;font-weight:800;font-size:1.1rem;display:flex;flex-direction:column;min-height:0;box-shadow:0 4px 0 var(--bd);transition:transform .1s}
.tile{display:flex;align-items:center;justify-content:center;background:#fff;border:3px solid var(--bd);border-radius:18px;overflow:hidden;min-width:0}
.tile img{max-width:100%;max-height:100%;object-fit:contain;display:block}
.big{width:min(100%,320px);flex:1 1 0;min-height:56px;max-height:200px;margin:4px auto;padding:8px;font-size:clamp(44px,11vh,100px);line-height:1;animation:pop .5s}
.sm{flex:1 1 0;min-height:28px;margin-bottom:4px;padding:4px;font-size:2.2rem;line-height:1;border-width:2px;border-radius:10px}
.opt:hover:not(:disabled){transform:translateY(-2px)}
.opt:disabled{opacity:1;cursor:default}
.opt.sel{background:#e4d9ff;color:#2a2140;border-color:var(--both);box-shadow:0 4px 0 var(--both);transform:translateY(-2px)}
.opt.good{background:#c9f7d9;color:#0d3b22}.opt.bad{background:#ffd6d6;color:#4a1010}.opt.miss{background:#fff3c4;color:#4a3a00;border-style:dashed}
@media(max-width:820px){.wrap{height:auto;display:block}.big{flex:none;height:150px;font-size:90px}.sm{flex:none;height:64px}.grid{flex:none;grid-template-rows:none}}
@media(max-width:480px){.sm{height:54px}.big{height:140px;font-size:80px}}
@keyframes bob{50%{transform:translateY(-6px)}}
#boulder{animation-name:wob}
@keyframes wob{50%{margin-top:-5px}}
@keyframes hop{50%{margin-top:-26px}}
@keyframes wave{to{transform:translate(-50%,-100%) rotate(8deg)}}
@keyframes drift{from{left:-80px}to{left:110%}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes shake{20%{transform:translate(-8px,4px)}40%{transform:translate(8px,-4px)}60%{transform:translate(-6px,2px)}80%{transform:translate(6px,0)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.15)}100%{transform:scale(1);opacity:1}}
@keyframes burst{to{transform:translate(var(--dx),var(--dy)) scale(1.6);opacity:0}}
@keyframes fall{to{transform:translateY(110vh) rotate(720deg)}}
@media(max-width:480px){.scene,.main .scene{height:300px}.dev{font-size:60px}h1{font-size:1.6rem}}
@media(prefers-reduced-motion:reduce){*{animation-duration:.01s!important}}
</style>
</head>
<body>
<div class="wrap">
  <h1><span>⛰️</span> Leo núi cùng thiết bị nhập – xuất <span>🧗</span></h1>
  <p class="sub">Phân loại đúng để phá tảng đá, leo lên đỉnh núi và cắm cờ chiến thắng!</p>
  <div class="hud">
    <span class="pill" id="lives"></span>
    <span class="pill" id="stg">🏔️ Chặng 1/2</span><span class="pill" id="score">⭐ 0</span><span class="pill" id="tm">⏱️ 00:00</span>
    <div class="meter" title="Độ cao"><i id="mt"></i></div>
    <span class="pill snd" id="snd" onclick="toggleSnd()">🔊</span>
  </div>
  <div class="main">
  <div class="scene" id="scene">
    <div class="sun">☀️</div>
    <div class="cloud" style="top:30px;animation-duration:38s">☁️</div>
    <div class="cloud" style="top:80px;animation-duration:55s;animation-delay:-20s;font-size:34px">☁️</div>
    <svg viewBox="0 0 100 100" preserveAspectRatio="none" aria-hidden="true">
      <polygon points="-5,100 -5,55 18,40 35,62 50,48 70,70 90,45 105,60 105,100" fill="var(--m1)"/>
      <polygon points="8,100 72,14 118,100" fill="var(--m3)"/>
      <polygon points="-10,100 40,32 95,100" fill="var(--m2)"/>
      <polygon points="40,32 33,44 38,41 41,47 46,42 49,45" fill="var(--snow)"/>
      <polygon points="72,14 64,28 69,25 72,31 77,26 81,30" fill="var(--snow)"/>
      <polyline id="path" fill="none" stroke="#ffd23f" stroke-width="3" stroke-dasharray="2 7" vector-effect="non-scaling-stroke" stroke-linecap="round"/>
      <rect x="0" y="94" width="100" height="6" fill="var(--gr)"/>
    </svg>
    <div id="ledges"></div>
    <span class="tree" style="left:4%">🌲</span><span class="tree" style="left:11%;font-size:22px">🌳</span><span class="tree" style="left:88%">🌲</span><span class="tree" style="left:94%;font-size:22px">🌳</span>
    <div class="combo" id="combo"></div>
    <div class="sp" id="flag">🚩</div>
    <div class="sp" id="boulder">🪨</div>
    <div class="sp" id="climber">🧗</div>
  </div>
  <div class="card" id="card"></div>
  </div>
  <div class="guide">
    <div><b style="color:var(--in)">⬆️ Thiết bị nhập</b>Gửi, đưa, truyền, nhập thông tin <u>vào</u> máy tính.</div>
    <div><b style="color:var(--out)">⬇️ Thiết bị xuất</b>Đưa kết quả xử lí của máy tính <u>đến con người</u>.</div>
  </div>
</div>

const $=id=>document.getElementById(id);
let queue,pos,lives,cur,locked,score,streak,snd=true,ac;
let t0=0,tAcc=0,tId=0;
const fmt=ms=>{const s=Math.floor(ms/1000);return String(s/60|0).padStart(2,"0")+":"+String(s%60).padStart(2,"0")};
function tShow(){$("tm").textContent="⏱️ "+fmt(tAcc+(tId?Date.now()-t0:0))}
function tStart(){clearInterval(tId);t0=Date.now();tId=setInterval(tShow,250);tShow()}
function tStop(){if(!tId)return;clearInterval(tId);tAcc+=Date.now()-t0;tId=0;tShow()}
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[a[i],a[j]]=[a[j],a[i]]}return a};
const N=12;const P=i=>({x:i===N?72:(i%2?64:32)+(i%3)*3,y:88-i*(70/N)});
function place(el,i,dx=0,dy=0){const p=P(i);el.style.left=(p.x+dx)+"%";el.style.top=(p.y+dy)+"%"}
function build(){
  let s="",l="";
  for(let i=0;i<=N;i++){const p=P(i);s+=p.x+","+p.y+" ";if(i===N/2)l+=`<div class="sp" style="left:${p.x+9}%;top:${p.y+1}%;font-size:26px;transition:none">⛺</div>`;l+=`<div class="ledge" style="left:${p.x}%;top:${p.y}%"></div>`}
  $("path").setAttribute("points",s);$("ledges").innerHTML=l;
}
function tone(f,d,t="square",v=.08,at=0){if(!snd)return;try{ac=ac||new (window.AudioContext||window.webkitAudioContext)();const o=ac.createOscillator(),g=ac.createGain();o.type=t;o.frequency.value=f;g.gain.value=v;o.connect(g);g.connect(ac.destination);const n=ac.currentTime+at;o.start(n);g.gain.exponentialRampToValueAtTime(.001,n+d);o.stop(n+d)}catch(e){}}
const sfx={ok:()=>[523,659,784].forEach((f,i)=>tone(f,.15,"triangle",.1,i*.09)),no:()=>[300,220,150].forEach((f,i)=>tone(f,.2,"sawtooth",.08,i*.1)),win:()=>[523,659,784,1047,784,1047].forEach((f,i)=>tone(f,.2,"triangle",.1,i*.12))};

function hud(){$("stg").textContent="🏔️ Chặng "+stage+"/2";$("lives").textContent="❤️".repeat(lives)+"🖤".repeat(LIVES-lives);$("score").textContent="⭐ "+score;$("mt").style.width=(pos/N*100)+"%"}
function pull(){if(!queue.length)queue=shuffle(D);return queue.shift()}
function burst(e,list){const sc=$("scene"),b=e.getBoundingClientRect(),r=sc.getBoundingClientRect();
  for(let i=0;i<10;i++){const s=document.createElement("span");s.className="pt";s.textContent=list[i%list.length];
    s.style.left=(b.left-r.left+b.width/2)+"px";s.style.top=(b.top-r.top+b.height/2)+"px";
    s.style.setProperty("--dx",(Math.random()*160-80)+"px");s.style.setProperty("--dy",(Math.random()*-120-10)+"px");sc.appendChild(s);setTimeout(()=>s.remove(),900)}}
function confetti(){for(let i=0;i<45;i++){const s=document.createElement("span");s.className="cf";s.textContent=["🎉","⭐","🎊","✨","🏆"][i%5];s.style.left=Math.random()*100+"vw";s.style.animationDelay=Math.random()*1.2+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),4500)}}
function start(){stage=1;STEPS=N/2;tAcc=0;tStart();$("scene").classList.remove("s2");queue=shuffle(D);pos=0;lives=LIVES;score=0;streak=0;$("combo").style.display="none";build();place($("flag"),N,0,-2);place($("climber"),0);$("climber").textContent="🧗";hud();ask()}

  ${vis(cur,"big")}<div class="devname">${nm(cur)}</div>
  <div class="btns">
   <button class="a b-in" onclick="pick('in')"><b>⬆️</b>NHẬP<small>Input · phím 1</small></button>
   <button class="a b-out" onclick="pick('out')"><b>⬇️</b>XUẤT<small>Output · phím 2</small></button>
   <button class="a b-both" onclick="pick('both')"><b>↕️</b>VỪA NHẬP VỪA XUẤT<small>Input + Output · phím 3</small></button>
  </div><div class="fb" id="fb"></div><button class="a next" id="next" onclick="nxt()">Tiếp tục ▶</button>`;
}
function pick(a){
  if(locked)return;locked=true;
  document.querySelectorAll(".btns button").forEach(b=>b.disabled=true);
  const ok=a===cur[2],fb=$("fb"),b=$("boulder"),c=$("climber");
  if(ok){
    sfx.ok();burst(b,["💥","✨","⭐"]);b.classList.add("gone");pos++;streak++;
    const bonus=streak>=2?streak*2:0;score+=10+bonus;
    place(c,pos);c.classList.remove("up");void c.offsetWidth;c.classList.add("up");
    if(streak>=2){const cb=$("combo");cb.style.display="block";cb.textContent="🔥 Combo x"+streak+"!";cb.style.animation="none";void cb.offsetWidth;cb.style.animation=""}
    fb.className="fb ok";fb.innerHTML=`✅ <b>Giỏi quá!</b> ${nm(cur)} là <b>${T[cur[2]]}</b>. ${cur[3]}`;
  }else{
    sfx.no();lives--;streak=0;$("combo").style.display="none";c.textContent="😵";
    const sc=$("scene");sc.classList.remove("shake");void sc.offsetWidth;sc.classList.add("shake");burst(c,["💢","🪨","💫"]);
    if(pos>0){pos--;place(c,pos)}queue.push(cur);
    fb.className="fb no";fb.innerHTML=`❌ <b>Ôi, trượt chân rồi!</b> ${nm(cur)} là <b>${T[cur[2]]}</b>. ${cur[3]}`;
  }
  hud();$("card").classList.add("done");
  const n=$("next");n.style.display="block";
  n.textContent=pos>=STEPS?"🏁 Lên đỉnh rồi!":lives<=0?"Xem kết quả":"Tiếp tục ▶";
  n.focus();
}
function nxt(){if(pos>=STEPS)return stage===1?bridge():finish(true);if(lives<=0)return finish(false);stage===1?ask():ask2()}
function bridge(){tStop();sfx.win();confetti();$("card").innerHTML=`<div class="end"><div class="dev">🎉</div><div class="devname">Hoàn thành Chặng 1!</div><p class="hint">Em đã leo nửa núi (⏱️ ${fmt(tAcc)}) và tới trại nghỉ ⛺! Chặng 2: leo nửa còn lại bằng cách chọn <b>nhiều đáp án</b> cùng lúc!</p><button class="a b-out" style="padding:10px 30px" onclick="start2()">⛰️ Sang Chặng 2</button></div>`}
let sel,its,corr,q2,cur2;
function start2(){stage=2;STEPS=N;pos=N/2;lives=LIVES;streak=0;tStart();q2=shuffle(["in","out","both","in","out","both"]);$("combo").style.display="none";place($("climber"),pos);hud();ask2()}
function ask2(){
  locked=false;$("card").classList.remove("done");sel=new Set();cur2=q2.shift();const t=cur2;
  const inn=D.filter(d=>d[2]==="in"),out=D.filter(d=>d[2]==="out"),bo=D.filter(d=>d[2]==="both");
  let ok,bad;
  if(t==="both"){ok=bo;bad=[D.find(d=>d[1]==="Micro"),D.find(d=>d[1].startsWith("Tai nghe"))].concat(shuffle(inn.concat(out).filter(d=>d[1]!=="Micro"&&!d[1].startsWith("Tai nghe"))).slice(0,2))}
  else{const k=2+(Math.random()*2|0);ok=shuffle(t==="in"?inn:out).slice(0,k);bad=shuffle(t==="in"?out:inn).slice(0,6-k)}
  its=shuffle(ok.concat(bad));corr=new Set(ok.map(d=>d[1]));
  const lbl={in:"NHẬP",out:"XUẤT",both:"VỪA NHẬP VỪA XUẤT"}[t];
  const b=$("boulder");b.className="sp";place(b,pos+1,-9,0);$("climber").textContent="🧗";
  $("card").innerHTML=`<div class="hint q">🪨 Chặng 2 · Chọn TẤT CẢ thiết bị <b style="color:var(--${t==="both"?"both":t})">${lbl}</b> (có ${ok.length} đáp án đúng)</div>
  <div class="grid">${its.map((d,i)=>`<button class="opt" onclick="tog(${i})">${vis(d,"sm")}${nm(d)}</button>`).join("")}</div>
  <button class="a b-both" id="chk" style="padding:10px 30px" onclick="check2()">✔ Kiểm tra</button>
  <div class="fb" id="fb"></div><button class="a next" id="next" onclick="nxt()">Tiếp tục ▶</button>`;
}
function tog(i){if(locked)return;const n=its[i][1];sel.has(n)?sel.delete(n):sel.add(n);document.querySelectorAll(".opt")[i].classList.toggle("sel",sel.has(n));tone(660,.06,"triangle",.06)}
function check2(){
  if(locked||!sel.size)return;locked=true;
  document.querySelectorAll(".opt").forEach((o,i)=>{const n=its[i][1],c=corr.has(n),s=sel.has(n);o.disabled=true;o.classList.remove("sel");o.classList.add(c&&s?"good":s?"bad":c?"miss":"x")});
  $("chk").style.display="none";
  const ok=sel.size===corr.size&&[...sel].every(n=>corr.has(n));
  const fb=$("fb"),b=$("boulder"),c=$("climber"),list=its.filter(d=>corr.has(d[1])).map(nm).join(", ");
  if(ok){
    sfx.ok();burst(b,["💥","✨","⭐"]);b.classList.add("gone");pos++;streak++;score+=20+(streak>=2?streak*2:0);
    place(c,pos);c.classList.remove("up");void c.offsetWidth;c.classList.add("up");
    if(streak>=2){const cb=$("combo");cb.style.display="block";cb.textContent="🔥 Combo x"+streak+"!"}
    fb.className="fb ok";fb.innerHTML=`✅ <b>Chính xác!</b> Đáp án: ${list}.`;
  }else{
    sfx.no();lives--;streak=0;$("combo").style.display="none";c.textContent="😵";
    const sc=$("scene");sc.classList.remove("shake");void sc.offsetWidth;sc.classList.add("shake");burst(c,["💢","🪨","💫"]);
    if(pos>N/2){pos--;place(c,pos)}q2.push(cur2);
    fb.className="fb no";fb.innerHTML=`❌ <b>Chưa đúng!</b> Đáp án đúng: ${list}.`;
  }
  hud();$("card").classList.add("done");const n=$("next");n.style.display="block";
  n.textContent=pos>=STEPS?"🏁 Lên đỉnh rồi!":lives<=0?"Xem kết quả":"Tiếp tục ▶";
}
function finish(win){tStop();
  if(win){sfx.win();confetti();$("climber").textContent="🥳";place($("climber"),STEPS,0,4)}
  $("card").innerHTML=`<div class="end"><div class="dev">${win?"🏆":"😢"}</div>
  <div class="devname">${win?"Chúc mừng! Em đã chinh phục đỉnh núi!":"Dừng chân ở độ cao "+pos+"/"+N}</div>
  <p class="hint">⭐ Điểm: ${score} · ⏱️ Thời gian leo: ${fmt(tAcc)}<br>${win?"Em phân biệt rất giỏi thiết bị nhập, xuất và vừa nhập vừa xuất!":"Đọc lại bảng ghi nhớ bên dưới rồi leo lại nhé, cố lên!"}</p>
  <button class="a b-both" style="padding:10px 30px" onclick="start()">🔄 Chơi lại</button></div>`;
}
document.addEventListener("keydown",e=>{if(locked||stage!==1)return;const k={1:"in",2:"out",3:"both"}[e.key];if(k)pick(k)});
start();
</script>
</body>
</html>
