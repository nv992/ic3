<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Thẻ ghi nhớ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="index.css?v=1">
<style>
:root{--ok-soft:#e1f6e9;--okd:#15803d;--ok:#22c55e}
/* Nút Quay lại */
.navrow{margin-bottom:18px}
.navrow .back{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 18px 0 6px;color:var(--blue);font-weight:600;font-size:15px;background:var(--primary-soft);box-shadow:none;transition:background .18s,color .18s,box-shadow .18s}
.navrow .back .ar{display:grid;place-items:center;width:28px;height:28px;border-radius:50%;background:#fff;box-shadow:0 2px 6px rgba(79,107,255,.25);font-size:15px;line-height:1;transition:transform .18s}
.navrow .back:hover{background:var(--primary);color:#fff;box-shadow:0 6px 16px rgba(79,107,255,.35);transform:none}
.navrow .back:hover .ar{transform:translateX(-3px);color:var(--primary)}

.fc-banner{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.fc-banner h1{margin:0;font-size:clamp(22px,4vw,30px);font-weight:800;line-height:1.2}
.fc-banner p{margin:4px 0 0;font-weight:500;color:rgba(27,35,64,.7)}
.fc-banner .ico{display:grid;place-items:center;flex:none;width:64px;height:64px;border-radius:50%;background:#fff;font-size:32px;box-shadow:0 8px 20px rgba(27,35,64,.15)}

/* Thanh tiến độ */
.fc-bar{display:flex;align-items:center;gap:16px;margin:0 0 20px}
.fc-count{flex:none;font-weight:700;font-size:15px;min-width:70px;text-align:center;color:var(--blue);background:var(--primary-soft);border-radius:999px;padding:6px 16px}
.fc-track{flex:1;height:10px;background:var(--surface2);border-radius:999px;overflow:hidden}
.fc-fill{height:100%;width:0;background:linear-gradient(90deg,var(--c),var(--cd));border-radius:999px;transition:width .3s}
.fc-stats{flex:none;font-weight:600;font-size:14.5px;display:flex;gap:10px}
.fc-stats span{background:#fff;border-radius:999px;padding:5px 14px;box-shadow:var(--shadow-sm)}

/* Thẻ lật */
html{scrollbar-gutter:stable}
.scene{perspective:2600px;margin:0 auto;max-width:720px}
.card{display:grid;will-change:transform;transform-style:preserve-3d;transition:transform .5s cubic-bezier(.3,.7,.3,1);cursor:pointer;min-height:min(420px,62vh);outline-offset:6px;border-radius:30px}
.card.flipped{transform:rotateY(180deg)}
.face{grid-area:1/1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:60px 30px 44px;text-align:center;border-radius:30px;box-shadow:0 18px 44px rgba(27,35,64,.12);backface-visibility:hidden;-webkit-backface-visibility:hidden;position:relative}
.face.front{background:#fff}
.face.back{background:linear-gradient(160deg,var(--ct),#fff 85%);transform:rotateY(180deg)}
.face .tag{position:absolute;top:18px;left:18px;font-weight:700;font-size:13px;color:var(--cd);background:var(--ct);border-radius:999px;padding:4px 14px;max-width:calc(100% - 110px)}
.face .side{position:absolute;top:22px;right:22px;font-weight:700;font-size:12.5px;letter-spacing:.8px;text-transform:uppercase;color:var(--muted)}
.face .fico{display:grid;place-items:center;width:84px;height:84px;border-radius:50%;background:var(--ct);font-size:42px;line-height:1}
.face.back .fico{background:#fff;box-shadow:var(--shadow-sm)}
[hidden]{display:none!important}
.face .pic{display:block;width:auto;height:auto;max-width:min(100%,400px);max-height:210px;object-fit:contain;background:#fff;border-radius:18px;padding:8px;box-shadow:var(--shadow-sm)}
.face .txt{font-weight:700;font-size:clamp(24px,4.4vw,36px);line-height:1.3;max-width:34ch}
.face.back .txt{font-weight:600;font-size:clamp(19px,3.4vw,26px);text-align:left;display:grid;gap:12px;max-width:40ch}
.face.back .txt p{margin:0}
.face.back .txt.cols{grid-auto-flow:column;grid-template-columns:auto auto;gap:12px 40px;max-width:100%;justify-content:center}
.face.back .txt.one{text-align:center}
.face.back .txt b{background:#fff;border-radius:8px;padding:1px 8px;box-shadow:var(--shadow-sm);font-weight:700}
.face .hint{position:absolute;bottom:16px;left:0;right:0;font-weight:500;font-size:13.5px;color:#9aa3bd}

/* Nút điều khiển */
.fc-ctrl{display:flex;justify-content:center;align-items:center;gap:12px;flex-wrap:wrap;margin:26px 0 14px}
.fb{font:inherit;font-weight:600;font-size:16px;cursor:pointer;color:var(--ink);background:#fff;border:0;border-radius:14px;padding:11px 24px;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,background .15s}
.fb:hover:not(:disabled){transform:translateY(-2px);box-shadow:0 8px 18px rgba(27,35,64,.12)}
.fb:active:not(:disabled){transform:scale(.98)}
.fb:disabled{background:var(--surface2);color:#a2aac2;box-shadow:none;cursor:default}
.fb.flip{background:linear-gradient(135deg,var(--primary),var(--primary2));color:#fff;padding:11px 32px;box-shadow:0 8px 20px rgba(79,107,255,.35)}
.fb.flip:hover:not(:disabled){box-shadow:0 12px 26px rgba(79,107,255,.42)}
.fb.no{background:#fde8e8;color:#7f1d1d}
.fb.yes{background:linear-gradient(135deg,#34d27b,#16a34a);color:#fff;box-shadow:0 8px 20px rgba(34,197,94,.35)}
.fb.yes:disabled{background:var(--surface2);color:#a2aac2;box-shadow:none}
.fb.big{font-size:17px;padding:13px 30px}
.fc-main{display:flex;align-items:flex-start;justify-content:center;gap:26px}
.fc-main .scene{flex:1 1 auto;min-width:0;max-width:720px;margin:0}
.fc-main .fc-ctrl{flex:none;flex-direction:column;align-items:stretch;justify-content:flex-start;gap:12px;width:180px;margin:0}
.fc-main .fc-ctrl .fb{width:100%;text-align:center;padding-left:12px;padding-right:12px}
.fc-tools{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin-top:6px}
.fc-tools .fb{font-size:15px;padding:7px 18px}

/* Màn hình hoàn thành */
.fc-done{max-width:560px;margin:10px auto;text-align:center;background:#fff;border-radius:28px;box-shadow:var(--shadow);padding:34px 26px}
.fc-done .trophy{font-size:60px;line-height:1}
.fc-done h2{margin:10px 0 6px;font-size:28px;font-weight:800}
.fc-done p{margin:0 0 20px;font-weight:500;color:var(--muted)}
.fc-done .fc-ctrl{margin:0}
.fc-done a.fb{text-decoration:none;display:inline-block}

@media(max-width:820px){
  .fc-main{flex-direction:column;align-items:stretch;gap:0}
  .fc-main .scene{max-width:none}
  .fc-main .fc-ctrl{flex-direction:row;width:100%;margin:22px 0 10px;justify-content:flex-end}
  .fc-main .fc-ctrl .fb{width:auto;flex:1}
}
@media(max-width:560px){
  .navrow .back{height:36px;font-size:14px;padding:0 14px 0 5px}
  .navrow .back .ar{width:26px;height:26px}
  .face.back .txt.cols{grid-auto-flow:row;grid-template-columns:1fr;grid-template-rows:none!important;justify-content:stretch;gap:10px}
}
@media(max-width:700px){
  .face .pic{max-height:150px}
  .fc-bar{flex-wrap:wrap}
  .fc-track{order:3;flex:1 1 100%}
  .fc-stats{margin-left:auto}
  .face{padding:56px 20px 40px}
  .fb{padding:10px 18px}
  .fb.big{flex:1}
}
@media(prefers-reduced-motion:reduce){.card{transition:none}}
</style>
</head>
<body>
<div class="topbar"><div class="wrap"><a href="index.html"><span id="siteIcon">🚀</span><span>Trang chủ</span></a></div></div>
<main class="wrap" id="app"><div class="empty">Đang tải…</div></main>

<script>
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const md=s=>esc(s).replace(/\*\*(.+?)\*\*/g,'<b>$1</b>');
const $=id=>document.getElementById(id);

const id=(new URLSearchParams(location.search).get('d')||'').replace(/[^\w-]/g,'');
let DECK,all,queue,pos,flipped,known,again;

const backUrl=()=>/^index\.html(#.*)?$/.test(DECK.backUrl||'')?DECK.backUrl:'index.html';
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}

function start(order){
  queue=order;pos=0;flipped=false;known=new Set();again=new Set();
  shell();show(false);
}

function shell(){
  const col=esc(DECK.color||'blue');
  $('app').innerHTML=`<div class="${col}">
    <div class="navrow"><a class="back" href="${esc(backUrl())}"><span class="ar">←</span>Quay lại</a></div>
    <div class="banner ${col} fc-banner">
      <div class="bmain"><div class="ico">${esc(DECK.icon||'🃏')}</div><div><h1>${esc(DECK.title)}</h1>${DECK.subtitle?`<p>${esc(DECK.subtitle)}</p>`:''}</div></div>
    </div>
    <div id="study">
      <div class="fc-bar"><div class="fc-count" id="count"></div><div class="fc-track"><div class="fc-fill" id="fill"></div></div>
        <div class="fc-stats"><span id="sYes">✅ 0</span></div></div>
      <div class="fc-main"><div class="scene"><div class="card" id="card" role="button" tabindex="0" aria-label="Thẻ ghi nhớ, bấm để lật">
        <div class="face front"><span class="tag" id="tag"></span><span class="side">Câu hỏi</span><div class="txt" id="front"></div><div class="hint">Bấm vào thẻ để xem đáp án</div></div>
        <div class="face back"><span class="tag" id="tag2"></span><span class="side">Đáp án</span><img class="pic" id="pic2" alt="" hidden><div class="fico" id="fico2"></div><div class="txt" id="back"></div></div>
      </div></div>
      <div class="fc-ctrl">
        <button class="fb big flip" id="flip">Lật thẻ</button>
        <button class="fb big yes" id="yes" disabled>✅ Đã nhớ</button>
      </div></div>
    </div>
    <div id="done" hidden></div>
  </div>`;
  $('card').onclick=flip;
  $('flip').onclick=flip;
  $('yes').onclick=mark;
}

function setPic(im,ico,src,icon){
  const showIcon=()=>{im.hidden=true;im.removeAttribute('src');ico.textContent=icon||'';ico.hidden=!icon};
  im.onerror=showIcon;
  if(src){im.src=src;im.hidden=false;ico.hidden=true}
  else showIcon();
}
function fill(c){
  $('tag').textContent=$('tag2').textContent=c.tag||'';
  setPic($('pic2'),$('fico2'),c.imgBack||c.img,c.icon);
  $('front').innerHTML=md(c.front);
  const lines=String(c.back).split('\n');
  const cols=lines.length>=4&&Math.max(...lines.map(l=>l.replace(/\*\*/g,'').length))<=40;
  const B=$('back');
  B.className='txt'+(lines.length===1?' one':'')+(cols?' cols':'');
  B.style.gridTemplateRows=cols?'repeat('+Math.ceil(lines.length/2)+',auto)':'';
  $('back').innerHTML=lines.map(l=>`<p>${md(l)}</p>`).join('');
}

function show(delay){
  if(pos>=queue.length)return finish();
  $('study').hidden=false;$('done').hidden=true;
  const c=all[queue[pos]];
  const wasFlipped=$('card').classList.contains('flipped');
  flipped=false;
  $('card').classList.remove('flipped');
  const reduce=matchMedia('(prefers-reduced-motion:reduce)').matches;
  if(delay&&wasFlipped&&!reduce){setTimeout(()=>fill(c),220)}else fill(c);
  $('count').textContent=(pos+1)+' / '+queue.length;
  $('fill').style.width=(pos/queue.length*100)+'%';
  $('sYes').textContent='✅ '+known.size;
  $('yes').disabled=true;
  $('flip').textContent='Lật thẻ';
}

function flip(){
  if(!queue||pos>=queue.length)return;
  flipped=!flipped;
  $('card').classList.toggle('flipped',flipped);
  $('yes').disabled=!flipped;
  $('flip').textContent=flipped?'Xem câu hỏi':'Lật thẻ';
}

function mark(){
  if(!flipped)return;
  known.add(queue[pos]);
  pos++;show(true);
}

function finish(){
  $('study').hidden=true;
  const d=$('done');d.hidden=false;
  d.innerHTML=`<div class="fc-done">
    <div class="trophy">🏆</div>
    <h2>Em đã học hết bộ thẻ!</h2>
    <p>✅ Đã nhớ ${known.size} / ${queue.length} thẻ</p>
    <div class="fc-ctrl"><button class="fb big flip" id="again">↺ Học lại</button><a class="fb big" href="${esc(backUrl())}">← Về danh sách</a></div></div>`;
  $('again').onclick=()=>start(all.map((_,i)=>i));
}

document.addEventListener('keydown',e=>{
  if(!queue||$('study').hidden)return;
  const t=e.target;
  if(t.closest&&t.closest('button,a'))return;
  if(e.key===' '||e.key==='Enter'){e.preventDefault();flip()}
});

function init(){
  DECK=window.DECK;all=DECK.cards||[];
  document.title=DECK.title+' – Thẻ ghi nhớ';
  // Tải trước toàn bộ hình để lúc lật không bị khựng khi hình mới hiện ra
  all.forEach(c=>[c.img,c.imgBack].forEach(u=>{if(u)new Image().src=u}));
  if(!all.length){$('app').innerHTML='<div class="empty">Bộ thẻ này chưa có thẻ nào.</div>';return}
  start(all.map((_,i)=>i));
}
if(!id){$('app').innerHTML='<div class="empty">Thiếu mã bộ thẻ. Dùng đường dẫn dạng <b>flashcard.html?d=splv1_12</b></div>'}
else{
  const sc=document.createElement('script');
  sc.src='decks/'+id+'.js?v='+Date.now();
  sc.onload=init;
  sc.onerror=()=>$('app').innerHTML='<div class="empty">Không tải được bộ thẻ “'+esc(id)+'”.</div>';
  document.body.appendChild(sc);
}
</script>
</body>
</html>
